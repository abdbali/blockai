        .block-var { background-color: #a855f7; } /* Purple for variables */

        .lesson-content {
            display: none;
        }
        .lesson-content.active {
            display: block;

        const formatBlocks = (blockString) => {
            // Helper function to convert text to colored spans based on keywords
            let parts = blockString.split(' -> ');
            let html = '<div class="flex flex-wrap items-center gap-2">';
            
            parts.forEach((part, index) => {
                let type = 'block-text';
                let content = part;

                if (part.toLowerCase().includes('eğer') || part.toLowerCase().includes('değilse') || part.toLowerCase().includes('mantık')) type = 'block-logic';
                else if (part.toLowerCase().includes('tekrarla') || part.toLowerCase().includes('döngü') || part.toLowerCase().includes('bekle')) type = 'block-loop';
                else if (part.toLowerCase().includes('kamera') || part.toLowerCase().includes('yüz') || part.toLowerCase().includes('seslendir') || part.toLowerCase().includes('dinle') || part.toLowerCase().includes('sınıflandır') || part.toLowerCase().includes('filtre') || part.toLowerCase().includes('model') || part.toLowerCase().includes('tensor') || part.toLowerCase().includes('el hareket')) type = 'block-ai';
                else if (part.toLowerCase().includes('tıklandığında') || part.toLowerCase().includes('sürüklendiğinde') || part.toLowerCase().includes('başla')) type = 'block-event';
                else if (part.toLowerCase().includes('değişken') || part.toLowerCase().includes('puan') || part.toLowerCase().includes('isim')) type = 'block-var';

                html += `<span class="block-badge ${type}">${content}</span>`;
                if (index < parts.length - 1) {
                    html += `<i class="fa-solid fa-arrow-right text-slate-400 mx-1"></i>`;
                }
            });
            html += '</div>';
            return html;
        };

                    { l: "Seviye 3 (Eşik Değeri)", desc: "Sese göre karar alma.", b: "Sürekli Tekrarla -> Eğer [ Ortam Ses Seviyesi > 50 ] ise -> Ekrana Yazdır: ['Çok gürültülü!']" },
                    { l: "Seviye 4 (Renklerle Tepki)", desc: "Ses yüksekliğine göre arka planı değiştirme.", b: "Sürekli Tekrarla -> Eğer [ Ses > 60 ] ise -> Arka Planı Kırmızı Yap -> Değilse -> Arka Planı Yeşil Yap" },
                    { l: "Seviye 5 (Parti Işıkları)", desc: "Sese göre rastgele renk (müzik duyarlılığı).", b: "Sürekli Tekrarla -> Eğer [ Ses > 40 ] ise -> Rastgele Renk Filtresi Uygula -> 0.2 saniye bekle" }
                ]
            },
            {
                title: "Ders 15: Parmak Sayma (Handpose)",
                desc: "Yapay zekanın el eklemlerini (landmark) analiz ederek kaç parmağın havada olduğunu bulması.",
                color: "violet",
                levels: [
                    { l: "Seviye 1 (Basit Sayım)", desc: "Gösterilen parmak sayısını okuma.", b: "Kamerayı Aç -> Ekrana Yazdır: [ Gösterilen Parmak Sayısını Bul ]" },
                    { l: "Seviye 2 (Sözlü Söylem)", desc: "Sayıyı sese çevirme.", b: "El Hareketlerini İzle -> Seslendir: [ Gösterilen Parmak Sayısını Bul ]" },
                    { l: "Seviye 3 (Canlı Takip)", desc: "Sürekli olarak parmak sayısını okuma.", b: "Kamerayı Aç -> Sürekli Tekrarla -> Ekrana Yazdır: [ Gösterilen Parmak Sayısını Bul ] -> 1 saniye bekle" },
                    { l: "Seviye 4 (Şartlı Görev)", desc: "Belirli bir sayı gösterildiğinde eylem yapma.", b: "Sürekli Tekrarla -> Eğer [ Parmak Sayısı = 5 ] ise -> Seslendir: ['Çak bir beşlik!'] -> 3 saniye bekle" },
                    { l: "Seviye 5 (Şifre Çözücü)", desc: "Özel bir parmak hareketiyle kilit açma (Örn: 2 parmak = Barış işareti).", b: "Sürekli Tekrarla -> Eğer [ Parmak Sayısı = 2 ] ise -> Arka Planı Yeşil Yap -> Seslendir: ['Barış! Kilit açıldı.']" }
                ]
            }
        ];

        const container = document.getElementById('lessonsContainer');

        lessons.forEach((lesson, index) => {
            const card = document.createElement('div');
            card.className = `bg-white rounded-xl shadow-md border-t-4 border-${lesson.color}-500 overflow-hidden`;
            
            // Header (Clickable)
            const header = document.createElement('div');
            header.className = `p-5 cursor-pointer hover:bg-slate-50 transition flex justify-between items-center`;
            header.onclick = () => {
                const content = document.getElementById(`content-${index}`);
                const icon = document.getElementById(`icon-${index}`);
                if(content.classList.contains('active')) {
                    content.classList.remove('active');
                    icon.className = "fa-solid fa-chevron-down text-slate-400";
                } else {
                    content.classList.add('active');
                    icon.className = "fa-solid fa-chevron-up text-slate-600";
                }
            };
            header.innerHTML = `
                <div>
                    <h2 class="text-xl font-bold text-${lesson.color}-700">${lesson.title}</h2>
                    <p class="text-sm text-slate-500 mt-1">${lesson.desc}</p>
                </div>
                <i id="icon-${index}" class="fa-solid fa-chevron-down text-slate-400 transition-transform"></i>
            `;
            
            // Content
            const content = document.createElement('div');
            content.id = `content-${index}`;
            content.className = `lesson-content p-5 bg-slate-50 border-t border-slate-100`;
            
            let levelsHtml = '<div class="space-y-6">';
            lesson.levels.forEach(level => {
                levelsHtml += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="bg-${lesson.color}-100 text-${lesson.color}-800 text-xs font-bold px-2 py-1 rounded uppercase tracking-wide">${level.l}</span>
                            <span class="text-sm text-slate-600 font-medium">${level.desc}</span>
                        </div>
                        <div class="mt-3">
                            ${formatBlocks(level.b)}
                        </div>
                    </div>
                `;
            });
            levelsHtml += '</div>';
            content.innerHTML = levelsHtml;

            card.appendChild(header);
            card.appendChild(content);
            container.appendChild(card);
        });
    </script>
</body>
</html>
